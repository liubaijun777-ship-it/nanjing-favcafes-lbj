<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>南京 · 咖啡图鉴</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    /* ── Reset ── */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    /* ── Palette ── */
    :root {
      --rose:      #F2E2E2;
      --rose-mid:  #E8D0D0;
      --brick:     #C8A491;
      --brick-dk:  #A87860;
      --water:     #A9B2C3;
      --gray25:    rgba(180,175,170,0.40);
      --gray50:    rgba(140,135,130,0.55);
      --ink:       #2A2420;
      --ink-mid:   #6A5E58;
      --ink-lt:    #9A8E88;
      --cream:     rgba(248,242,238,0.96);
      --border:    rgba(200,164,145,0.22);
    }

    body {
      background: var(--rose);
      font-family: 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif;
      color: var(--ink);
      height: 100vh;
      overflow: hidden;
    }

    /* ── Map ── */
    #map {
      position: absolute;
      inset: 0;
      background: var(--rose);
    }

    /* 底图色调滤镜 → Morandi */
    .leaflet-tile-pane {
      filter: saturate(0.18) sepia(0.12) brightness(1.06) contrast(0.97);
    }

    /* 整体 rose 蒙版 */
    .leaflet-tile-pane::after {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--rose);
      mix-blend-mode: multiply;
      opacity: 0.28;
      pointer-events: none;
    }

    /* 点状纹理叠加层 */
    #texture-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 400;
      background-image:
        radial-gradient(circle, rgba(255,255,255,0.30) 0.8px, transparent 0.8px);
      background-size: 5px 5px;
      opacity: 0.65;
    }

    /* 边缘暗角（四周 fade） */
    #vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 401;
      background: radial-gradient(
        ellipse 80% 80% at 50% 50%,
        transparent 50%,
        rgba(210,190,185,0.35) 100%
      );
    }


    /* ── 图例块（右下） ── */
    #legend {
      position: absolute;
      bottom: 28px;
      left: 36px;
      z-index: 600;
      background: var(--cream);
      border: 1px solid var(--border);
      padding: 12px 16px;
      backdrop-filter: blur(8px);
    }
    #legend .legend-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 7px;
    }
    #legend .legend-row:last-child { margin-bottom: 0; }
    #legend .dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    #legend .dot-site {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--brick);
      border: 1.5px solid rgba(255,255,255,0.6);
      box-shadow: 0 0 0 2px rgba(200,164,145,0.3);
      flex-shrink: 0;
    }
    #legend .dot-cafe {
      background: var(--brick);
      border: 1.5px solid rgba(255,255,255,0.7);
      opacity: 0.7;
    }
    #legend .legend-text {
      font-size: 9px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-mid);
    }

    /* ── 侧列表面板 ── */
    #panel {
      position: absolute;
      top: 0; right: 0;
      width: 248px;
      height: 100%;
      background: var(--cream);
      border-left: 1px solid var(--border);
      z-index: 600;
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(10px);
      transition: transform 0.3s cubic-bezier(.4,0,.2,1);
    }
    #panel.hidden { transform: translateX(248px); }

    #panel-header {
      padding: 28px 20px 14px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    #panel-header .ph-label {
      font-size: 9px;
      letter-spacing: 0.22em;
      color: var(--ink-lt);
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    #panel-header h2 {
      font-size: 13px;
      font-weight: 600;
      color: var(--ink);
      letter-spacing: 0.04em;
    }

    #search {
      margin: 12px 14px 6px;
      padding: 7px 12px;
      border: 1px solid var(--border);
      border-radius: 0;
      background: rgba(255,255,255,0.5);
      font-size: 11px;
      font-family: inherit;
      color: var(--ink);
      outline: none;
      letter-spacing: 0.04em;
      width: calc(100% - 28px);
      transition: border-color 0.2s;
    }
    #search::placeholder { color: var(--ink-lt); }
    #search:focus { border-color: var(--brick); background: rgba(255,255,255,0.8); }

    #list {
      flex: 1;
      overflow-y: auto;
      padding: 6px 0 20px;
    }
    #list::-webkit-scrollbar { width: 3px; }
    #list::-webkit-scrollbar-thumb { background: var(--brick); opacity: 0.4; border-radius: 2px; }

    .cafe-row {
      padding: 9px 18px 9px 14px;
      border-left: 2px solid transparent;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    .cafe-row:hover { background: rgba(200,164,145,0.08); border-left-color: var(--brick); }
    .cafe-row.active { background: rgba(200,164,145,0.14); border-left-color: var(--brick-dk); }
    .cafe-row .idx {
      font-size: 9px;
      font-weight: 700;
      color: var(--brick);
      letter-spacing: 0.04em;
      min-width: 18px;
      padding-top: 1px;
    }
    .cafe-row .info { flex: 1; }
    .cafe-row .cname {
      font-size: 12px;
      font-weight: 600;
      color: var(--ink);
      letter-spacing: 0.02em;
      line-height: 1.3;
    }
    .cafe-row .caddr {
      font-size: 10px;
      color: var(--ink-lt);
      margin-top: 2px;
      line-height: 1.4;
      letter-spacing: 0.02em;
    }
    .cafe-row .district-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      margin-top: 5px;
      flex-shrink: 0;
    }

    /* 面板切换按钮 */
    #panel-toggle {
      position: absolute;
      top: 50%;
      right: 248px;
      transform: translateY(-50%);
      z-index: 601;
      width: 20px; height: 48px;
      background: var(--cream);
      border: 1px solid var(--border);
      border-right: none;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: right 0.3s cubic-bezier(.4,0,.2,1);
      color: var(--ink-lt);
      font-size: 9px;
    }
    #panel.hidden ~ #panel-toggle { right: 0; }

    /* ── Leaflet popup ── */
    .leaflet-popup-content-wrapper {
      background: var(--cream) !important;
      border: 1px solid var(--border) !important;
      border-radius: 2px !important;
      box-shadow: 0 4px 20px rgba(60,40,30,0.12) !important;
      backdrop-filter: blur(8px);
      padding: 0 !important;
    }
    .leaflet-popup-tip-container { display: none; }
    .leaflet-popup-content { margin: 0 !important; }

    .popup-body {
      padding: 13px 16px 12px;
      min-width: 175px;
    }
    .popup-body .pnum {
      font-size: 9px;
      font-weight: 700;
      color: var(--brick);
      letter-spacing: 0.18em;
      margin-bottom: 4px;
    }
    .popup-body .pname {
      font-size: 14px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: 0.03em;
      line-height: 1.2;
    }
    .popup-body .paddr {
      font-size: 10.5px;
      color: var(--ink-mid);
      margin-top: 6px;
      line-height: 1.5;
      letter-spacing: 0.02em;
    }
    .popup-body .pdist {
      font-size: 9px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--brick);
      margin-top: 7px;
    }

    /* SITE popup */
    .popup-site .pnum { color: var(--brick-dk); }
    .popup-site .pdist { color: var(--brick-dk); }

    /* Zoom control 复写 */
    .leaflet-control-zoom {
      border: 1px solid var(--border) !important;
      border-radius: 2px !important;
      overflow: hidden;
    }
    .leaflet-control-zoom a {
      background: var(--cream) !important;
      color: var(--ink-mid) !important;
      border-color: var(--border) !important;
      font-size: 14px !important;
      line-height: 24px !important;
      width: 24px !important;
      height: 24px !important;
    }
    .leaflet-control-zoom a:hover { background: rgba(200,164,145,0.15) !important; }

    .leaflet-bottom.leaflet-right { bottom: 28px; right: 264px; }

    .leaflet-control-attribution {
      background: rgba(248,242,238,0.7) !important;
      color: var(--ink-lt) !important;
      font-size: 9px !important;
      right: 264px;
    }

    /* ── SITE 标记 ── */
    .site-marker-wrap {
      display: flex; align-items: center; gap: 7px;
    }
    .site-dot-el {
      width: 14px; height: 14px;
      border-radius: 50%;
      background: var(--brick);
      border: 2px solid rgba(255,255,255,0.85);
      box-shadow:
        0 0 0 3px rgba(200,164,145,0.28),
        0 2px 6px rgba(120,80,60,0.25);
      flex-shrink: 0;
    }
    .site-label-el {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.22em;
      color: var(--brick-dk);
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      white-space: nowrap;
    }

    /* ── Cafe 标记（通用容器） ── */
    .cafe-marker-el {
      width: 32px; height: 32px;
      cursor: pointer;
      transition: transform 0.12s;
    }
    .cafe-marker-el:hover { transform: scale(1.2); }
    .cafe-marker-el.active-dot {
      transform: scale(1.3);
      filter: drop-shadow(0 0 6px rgba(245,255,0,0.7)) drop-shadow(0 2px 4px rgba(0,0,0,0.3));
    }

    /* 无照片：荧光黄五角星 */
    .cafe-marker-el.no-photo {
      background: #F5FF00;
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
      filter: drop-shadow(0 2px 5px rgba(0,0,0,0.28));
    }

    /* 有照片：圆形裁切图片 */
    .cafe-marker-el.has-photo {
      border-radius: 50%;
      border: 2.5px solid rgba(255,255,255,0.9);
      box-shadow: 0 2px 8px rgba(80,50,30,0.28);
      overflow: hidden;
    }
    .cafe-marker-el.has-photo img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }
  </style>
</head>
<body>

<!-- 点状纹理 & 暗角 -->
<div id="texture-overlay"></div>
<div id="vignette"></div>


<!-- 图例 -->
<div id="legend">
  <div class="legend-row">
    <div class="dot dot-site"></div>
    <span class="legend-text">SITE — 紫金山</span>
  </div>
  <div class="legend-row">
    <div class="dot dot-cafe"></div>
    <span class="legend-text">CAFÉ LOCATION</span>
  </div>
</div>

<!-- 地图 -->
<div id="map"></div>

<!-- 侧边列表 -->
<div id="panel">
  <div id="panel-header">
    <div class="ph-label">Index / 索引</div>
    <h2>全部咖啡馆</h2>
  </div>
  <input id="search" type="text" placeholder="SEARCH…">
  <div id="list"></div>
</div>
<div id="panel-toggle" onclick="togglePanel()">▶</div>

<script>
// ── 数据 ──────────────────────────────────────────────────────────────────
// 坐标为基于街道地理知识估算值，误差约 100-400 m，可拖动标记校正
// photo 字段：填入图片路径即可，例如 "photos/waooo.jpg"
// 留空或 null 则显示首字母彩色圆点
const cafes = [
  { name:"颐和民国花园咖啡·茶", addr:"鼓楼区江苏路3号（颐和公馆内）",         district:"鼓楼区", lat:32.0682, lng:118.7578, photo:null },
  { name:"巷隅",                  addr:"鼓楼区厚载巷27-7号（云岭居北门旁）",   district:"鼓楼区", lat:32.0672, lng:118.7602, photo:null },
  { name:"开通咖啡",              addr:"鼓楼区西桥14-6号（云南路地铁6口）",    district:"鼓楼区", lat:32.0718, lng:118.7692, photo:null },
  { name:"小农场",                addr:"秦淮区王府大街37号-1（新街口21口）",   district:"秦淮区", lat:32.0491, lng:118.7756, photo:null },
  { name:"有时",                  addr:"鼓楼区集圣路9-9号",                    district:"鼓楼区", lat:32.0663, lng:118.7852, photo:null },
  { name:"nega monto",            addr:"秦淮区石鼓路41-7号（俞家巷后内）",     district:"秦淮区", lat:32.0528, lng:118.7808, photo:null },
  { name:"ukelili",               addr:"鼓楼区怡景花园22号103室",              district:"鼓楼区", lat:32.0756, lng:118.7700, photo:null },
  { name:"九月出",                addr:"秦淮区汉中路1-1号",                    district:"秦淮区", lat:32.0557, lng:118.7768, photo:null },
  { name:"胜利咖啡厅",            addr:"鼓楼区中山路75号福昌饭店2层",         district:"鼓楼区", lat:32.0738, lng:118.7778, photo:null },
  { name:"月合咖啡",              addr:"玄武区洪武北路132号",                  district:"玄武区", lat:32.0582, lng:118.7928, photo:null },
  { name:"恩正咖啡",              addr:"玄武区成贤街115号（浮桥地铁1口）",     district:"玄武区", lat:32.0614, lng:118.7988, photo:null },
  { name:"dw coffee",             addr:"中央路南京香格里拉大酒店旁",           district:"鼓楼区", lat:32.0825, lng:118.7824, photo:null },
  { name:"waooo",                 addr:"新街口街道如意里北区48号楼101",        district:"秦淮区", lat:32.0537, lng:118.7744, photo:null },
  { name:"rawsip",                addr:"凤凰街道汉中门大街30-5号",             district:"建邺区", lat:32.0480, lng:118.7462, photo:null },
  { name:"满椿",                  addr:"（地址待补充）",                       district:"鼓楼区", lat:32.0680, lng:118.7760, photo:null },
  { name:"豆搭搭",                addr:"中央路220-7号",                        district:"鼓楼区", lat:32.0820, lng:118.7818, photo:null },
  { name:"pause",                 addr:"上海路陶谷新村6号102室（近汉口西路）", district:"鼓楼区", lat:32.0710, lng:118.7722, photo:null },
  { name:"camphood",              addr:"五老村街道杨公井15号",                 district:"秦淮区", lat:32.0492, lng:118.7818, photo:null },
  { name:"润喉糖",                addr:"文德里66号-18室（少年宫正对面）",      district:"玄武区", lat:32.0646, lng:118.7972, photo:null },
  { name:"锦上",                  addr:"北京西路1-2号（鼓楼公园西北门）",      district:"鼓楼区", lat:32.0748, lng:118.7730, photo:null },
  { name:"failok coffee",         addr:"浦口区卓越路佳源玖棠府C区7幢1层139室", district:"浦口区", lat:32.0582, lng:118.6328, photo:null },
  { name:"Ripple coffee",         addr:"朝天宫街道秣陵路99号-1号",             district:"秦淮区", lat:32.0495, lng:118.7648, photo:null },
];

// 区域色（Morandi 系列）
const dcMap = {
  "鼓楼区":  "#C8A491",
  "秦淮区":  "#9BAF98",
  "玄武区":  "#9AAFC0",
  "建邺区":  "#B5A8C3",
  "雨花台区":"#B8A88A",
  "浦口区":  "#A8B5A8",
  "？":      "#AEAEAE",
};

// ── 地图 ──────────────────────────────────────────────────────────────────
const map = L.map('map', {
  center: [32.062, 118.790],
  zoom: 13,
  zoomControl: false,
  scrollWheelZoom: true,
});

L.control.zoom({ position: 'bottomright' }).addTo(map);

// CartoDB Positron（极简底图）
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  attribution: '© <a href="https://carto.com/">CARTO</a> © <a href="https://www.openstreetmap.org/copyright">OSM</a>',
  subdomains: 'abcd',
  maxZoom: 19
}).addTo(map);

// ── SITE 标记（紫金山）────────────────────────────────────────────────────
const siteIcon = L.divIcon({
  className: '',
  html: `<div class="site-marker-wrap">
           <div class="site-dot-el"></div>
           <span class="site-label-el">SITE</span>
         </div>`,
  iconSize: [80, 20],
  iconAnchor: [7, 10],
  popupAnchor: [40, -8],
});

L.marker([32.0800, 118.8402], { icon: siteIcon })
  .bindPopup(`
    <div class="popup-body popup-site">
      <div class="pnum">SITE · 核心地标</div>
      <div class="pname">紫金山</div>
      <div class="paddr">玄武区紫金山风景区<br>南京城市地理中心参照点</div>
      <div class="pdist">ZIJIN MOUNTAIN · NANJING</div>
    </div>
  `, { maxWidth: 240 })
  .addTo(map);

// ── 咖啡馆标记 ────────────────────────────────────────────────────────────
const markers = [];
const rowEls  = [];

cafes.forEach((c, i) => {
  const color = dcMap[c.district] || dcMap["？"];

  const icon = L.divIcon({
    className: '',
    html: `<div class="cafe-marker-el ${c.photo ? 'has-photo' : 'no-photo'}" id="dot-${i}">${c.photo ? `<img src="${c.photo}" alt="${c.name}">` : ''}</div>`,
    iconSize: [32, 32],
    iconAnchor: [16, 16],
    popupAnchor: [0, -18],
  });

  const marker = L.marker([c.lat, c.lng], { icon, draggable: true })
    .bindPopup(`
      <div class="popup-body">
        <div class="pnum">No.${String(i+1).padStart(2,'0')}</div>
        <div class="pname">${c.name}</div>
        <div class="paddr">${c.addr}</div>
        <div class="pdist">${c.district.toUpperCase()}</div>
      </div>
    `, { maxWidth: 240 })
    .addTo(map);

  marker.on('dragend', e => {
    const p = e.target.getLatLng();
    console.log(`${c.name}: ${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}`);
  });

  marker.on('click', () => {
    rowEls.forEach(r => r.classList.remove('active'));
    if (rowEls[i]) {
      rowEls[i].classList.add('active');
      rowEls[i].scrollIntoView({ behavior:'smooth', block:'nearest' });
    }
    document.querySelectorAll('.cafe-marker-el').forEach(d => d.classList.remove('active-dot'));
    const dot = document.getElementById(`dot-${i}`);
    if (dot) dot.classList.add('active-dot');
  });

  markers.push(marker);
});

// ── 列表渲染 ──────────────────────────────────────────────────────────────
function renderList(q = '') {
  const container = document.getElementById('list');
  container.innerHTML = '';
  rowEls.length = 0;
  let cnt = 0;

  cafes.forEach((c, i) => {
    const ql = q.toLowerCase();
    if (q && !c.name.toLowerCase().includes(ql) && !c.addr.toLowerCase().includes(ql) && !c.district.includes(q))
      return;

    const color = dcMap[c.district] || dcMap["？"];
    const el = document.createElement('div');
    el.className = 'cafe-row';
    el.innerHTML = `
      <span class="idx">${String(i+1).padStart(2,'0')}</span>
      <div class="info">
        <div class="cname">${c.name}</div>
        <div class="caddr">${c.addr}</div>
      </div>
      <div class="district-dot" style="background:${color}"></div>
    `;
    el.addEventListener('click', () => {
      map.setView([c.lat, c.lng], 16, { animate: true });
      setTimeout(() => markers[i].openPopup(), 420);
      rowEls.forEach(r => r.classList.remove('active'));
      el.classList.add('active');
    });
    container.appendChild(el);
    rowEls[i] = el;
    cnt++;
  });

}

renderList();
document.getElementById('search').addEventListener('input', function () {
  renderList(this.value.trim());
});

// ── 面板开关 ──────────────────────────────────────────────────────────────
function togglePanel() {
  const p = document.getElementById('panel');
  const btn = document.getElementById('panel-toggle');
  p.classList.toggle('hidden');
  btn.textContent = p.classList.contains('hidden') ? '◀' : '▶';
}
</script>
</body>
</html>
